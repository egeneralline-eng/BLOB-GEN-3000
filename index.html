<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blob-gen</title>
<style>
:root{--bg:#f6f4ef;--fg:#222;--mut:#777;--card:#fff;--line:#ddd;--acc:#2b6cb0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#e8e8e8;--mut:#999;--card:#222426;--line:#35373a;--acc:#6aa9ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#e8e8e8;--mut:#999;--card:#222426;--line:#35373a;--acc:#6aa9ee;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1380px;margin:0 auto;padding:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.stage{flex:1 1 400px;min-width:0}
canvas{width:100%;height:auto;aspect-ratio:1;display:block;border-radius:10px;border:1px solid var(--line);background:#f4f1ea}
.panel{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;width:100%;max-width:100%}
@media(min-width:960px){.panel{width:560px}}
h1{font-size:17px;margin:0 0 2px}
label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
label span b{color:var(--fg);font-weight:600;float:right}
input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input[type=number]{font:inherit;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=number]{width:100px}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);margin-top:2px}
#info{font-size:11px;color:var(--mut);margin-top:4px}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.cols{grid-template-columns:1fr 1fr}}
.col-sec{display:flex;flex-direction:column;gap:6px}

.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.like{position:relative;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;transition:transform .15s,border-color .2s}
.like[hidden]{display:none}
.like:hover{border-color:#e0457b}
.like:active{transform:scale(.96)}
.like .heart{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:fill .2s,stroke .2s}
.like.on{cursor:default;border-color:#e0457b}
.like.on .heart{fill:#e0457b;stroke:#e0457b;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.like .cnt{font-variant-numeric:tabular-nums;color:var(--mut);padding-left:8px;border-left:1px solid var(--line)}
.pt{position:absolute;left:19px;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#e0457b;pointer-events:none;animation:fly .7s ease-out forwards}
.foot .msg{font-size:11px;color:var(--mut)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.like.on .heart,.pt{animation:none}.pt{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="stage"><canvas id="cv" width="900" height="900"></canvas></div>
 <div class="panel">
  <h1>Blob-gen</h1>
  <div class="row">
   <button class="p" id="new">New spot</button>
   <button id="save">PNG</button>
   <span style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)">Seed <input type="number" id="seed" value="1"></span>
  </div>
  <hr>
  <div class="cols">
   <div class="col-sec">
    <label><span>Rotation <b id="v_yaw"></b>°</span><input type="range" id="yaw" min="0" max="360" value="45"></label>
    <label><span>Camera angle <b id="v_pitch"></b>°</span><input type="range" id="pitch" min="-60" max="60" value="29"></label>
    <label><span>Figure tilt <b id="v_lean"></b>°</span><input type="range" id="lean" min="-90" max="90" value="0"></label>
    <label><span>Perspective <b id="v_persp"></b></span><input type="range" id="persp" min="0" max="100" value="0"></label>
    <hr>
    <label><span>Legs <b id="v_legs"></b></span><input type="range" id="legs" min="0" max="4" value="2"></label>
    <label><span>Hands <b id="v_arms"></b></span><input type="range" id="arms" min="0" max="4" value="2"></label>
    <label><span>Random offshoots <b id="v_apps"></b></span><input type="range" id="apps" min="0" max="4" value="0"></label>
    <label><span>Limb lengths <b id="v_len"></b></span><input type="range" id="len" min="10" max="100" value="50"></label>
    <label><span>Number of limb segments <b id="v_seg"></b></span><input type="range" id="seg" min="1" max="4" value="3"></label>
    <label class="chk"><input type="checkbox" id="rl" checked> Random limbs in the new blob</label>
   </div>
   <div class="col-sec">
    <label><span>Symmetry <b id="v_sym"></b></span><input type="range" id="sym" min="0" max="100" value="100"></label>
    <label><span>Chaos ↔ Being <b id="v_cre"></b></span><input type="range" id="cre" min="0" max="100" value="75"></label>
    <label><span>Face Curvature <b id="v_curve"></b></span><input type="range" id="curve" min="0" max="100" value="0"></label>
    <hr>
    <label><span>Number of shapes <b id="v_n"></b></span><input type="range" id="n" min="6" max="120" value="30"></label>
    <label><span>Size of the shapes <b id="v_size"></b></span><input type="range" id="size" min="4" max="30" value="12"></label>
    <label><span>Size range <b id="v_spread"></b></span><input type="range" id="spread" min="0" max="100" value="50"></label>
    <label><span>Number of faces <b id="v_poly"></b></span><input type="range" id="poly" min="0" max="100" value="30"></label>
    <label><span>Variability <b id="v_irr"></b></span><input type="range" id="irr" min="0" max="100" value="40"></label>
    <hr>
    <label><span>Lighting <b id="v_light"></b></span><input type="range" id="light" min="0" max="100" value="0"></label>
    <label><span>Atmospheric perspective <b id="v_air"></b></span><input type="range" id="air" min="0" max="100" value="30"></label>
    <label><span>Transparency <b id="v_op"></b></span><input type="range" id="op" min="20" max="100" value="100"></label>
    <div class="row" style="margin-top:4px">
     <select id="pal"><option value="ink">Black</option><option value="gray">Shades of gray</option><option value="col">Muted colors</option></select>
     <label class="chk"><input type="checkbox" id="flt" checked> Rejection</label>
    </div>
    <div id="info"></div>
   </div>
  </div>
  <hr>
  <div class="foot">
   <button class="like" id="like" type="button" aria-pressed="false" hidden>
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <span id="likeLbl">Like</span><span class="cnt" id="likeCount">0</span>
   </button>
   <span class="msg" id="likeMsg" aria-live="polite"></span>
   <!-- здесь потом появится кнопка "Buy me a coffee" -->
  </div>
  <div id="ts"></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const ids=['n','size','spread','poly','irr','curve','cre','sym','yaw','pitch','lean','persp','legs','arms','apps','len','seg','light','air','op'];
function mk(s){let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const REG=[{x:-.05,y:-.62,z:.1,rx:.2,ry:.18,rz:.18,w:2,s:.8},{x:-.12,y:-.1,z:0,rx:.3,ry:.35,rz:.25,w:5,s:1.3},{x:-.12,y:.3,z:0,rx:.25,ry:.15,rz:.22,w:2,s:1}];
const TW=REG.reduce((a,r)=>a+r.w,0);
function rotm(ax,ay,az){const ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay),cc=Math.cos(az),sc=Math.sin(az);
 return[[cb*cc,sa*sb*cc-ca*sc,ca*sb*cc+sa*sc],[cb*sc,sa*sb*sc+ca*cc,ca*sb*sc-sa*cc],[-sb,sa*cb,ca*cb]]}
const mul=(M,v)=>[M[0][0]*v[0]+M[0][1]*v[1]+M[0][2]*v[2],M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]*v[2],M[2][0]*v[0]+M[2][1]*v[1]+M[2][2]*v[2]];
function hull(A){A=A.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
 const lo=[],up=[];
 for(const p of A){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 for(let i=A.length-1;i>=0;i--){const p=A[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 lo.pop();up.pop();return lo.concat(up)}
function connect(arr){
 const ord=[...arr].sort((a,b)=>b.rin-a.rin),placed=[ord[0]];
 for(let i=1;i<ord.length;i++){const s=ord[i];let bj=null,bd=1e9;
  for(const q of placed){const d=Math.hypot(s.c[0]-q.c[0],s.c[1]-q.c[1],s.c[2]-q.c[2])-(s.rin+q.rin);if(d<bd){bd=d;bj=q}}
  if(bd>0){const dx=s.c[0]-bj.c[0],dy=s.c[1]-bj.c[1],dz=s.c[2]-bj.c[2],dd=Math.hypot(dx,dy,dz)||1,lim=(s.rin+bj.rin)*.85;
   s.c=[bj.c[0]+dx/dd*lim,bj.c[1]+dy/dd*lim,bj.c[2]+dz/dd*lim]}
  placed.push(s)}
}
function makeFaces(s){
 const n=s.n,V=s.V,defs=[Array.from({length:n},(_,i)=>i),Array.from({length:n},(_,i)=>n+i)];
 for(let i=0;i<n;i++){const j=(i+1)%n;defs.push([i,j,n+j,n+i])}
 return defs.map(idx=>{let nx=0,ny=0,nz=0,cx=0,cy=0,cz=0;
  for(let i=0;i<idx.length;i++){const a=V[idx[i]],b=V[idx[(i+1)%idx.length]];
   nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1]);cx+=a[0];cy+=a[1];cz+=a[2]}
  if(nx*cx+ny*cy+nz*cz<0){nx=-nx;ny=-ny;nz=-nz}
  const l=Math.hypot(nx,ny,nz)||1;return{idx,n:[nx/l,ny/l,nz/l]}});
}
function frame(w,tw){
 const up=Math.abs(w[1])<.9?[0,1,0]:[1,0,0];
 let u=[up[1]*w[2]-up[2]*w[1],up[2]*w[0]-up[0]*w[2],up[0]*w[1]-up[1]*w[0]];
 const ul=Math.hypot(u[0],u[1],u[2]);u=u.map(x=>x/ul);
 const v=[w[1]*u[2]-w[2]*u[1],w[2]*u[0]-w[0]*u[2],w[0]*u[1]-w[1]*u[0]],c=Math.cos(tw),s=Math.sin(tw);
 const a=[u[0]*c+v[0]*s,u[1]*c+v[1]*s,u[2]*c+v[2]*s],b=[-u[0]*s+v[0]*c,-u[1]*s+v[1]*c,-u[2]*s+v[2]*c];
 return[[a[0],b[0],w[0]],[a[1],b[1],w[1]],[a[2],b[2],w[2]]];
}
function generate(P,seed,att){
 const rnd=mk(seed*7919+att*104729+1);
 const g=()=>Math.sqrt(-2*Math.log(1-rnd()))*Math.cos(6.2832*rnd());
 function build(c,R,hx,hy,h,tpF,tone,ue,rk,cs,forceTp){
  const e=Math.min(4,Math.floor(P.poly*ue*4.99)),tp=forceTp!=null?forceTp:1-(1-tpF)*(e>0?P.poly:0);
  const K=[[hx,hy],[-hx,hy],[-hx,-hy],[hx,-hy]],base=[];
  for(let k=0;k<4;k++){
   const rank=rk.filter(v=>v<rk[k]).length,q=K[k];
   if(rank<e){const f=.12+cs[k]*.16,pk=K[(k+3)%4],nk=K[(k+1)%4];
    base.push([q[0]+(pk[0]-q[0])*f,q[1]+(pk[1]-q[1])*f],[q[0]+(nk[0]-q[0])*f,q[1]+(nk[1]-q[1])*f])}
   else base.push(q)}
  const loc=base.map(q=>[q[0],q[1],-h]).concat(base.map(q=>[q[0]*tp,q[1]*tp,h]));
  return{c,V:loc.map(v=>mul(R,v)),rin:Math.min(h,Math.min(hx,hy))*.9*(1+tpF)/2,tone,n:base.length};
 }
 function fresh(){
  const rc=rnd(),rt=rnd(),g1=g(),g2=g(),g3=g(),ux=rnd(),uy=rnd(),g4=g(),gs=g(),gel=g(),uh=rnd(),utp=rnd(),ue=rnd();
  const rk=[rnd(),rnd(),rnd(),rnd()],cs=[rnd(),rnd(),rnd(),rnd()],ra=[],gr=[];
  for(let i=0;i<3;i++){ra.push([rnd(),rnd()]);gr.push(g())}
  const tone=rnd();
  let x,y,z,sz=1;
  if(rc<P.cre){let t=rt*TW,r=REG[0];for(const q of REG){if((t-=q.w)<0){r=q;break}}
   x=r.x+g1*r.rx*.4;y=r.y+g2*r.ry*.4;z=r.z+g3*r.rz*.4;sz=r.s}
  else{x=-ux*.95;y=(uy*2-1)*.9;z=g4*.3}
  x=Math.min(x,.04);
  const r=Math.max(.02,Math.min(.45,P.size*sz*Math.exp(P.spread*1.2*gs)));
  const el=Math.exp(gel*P.irr*.5),hx=.707*r,hy=.707*r*el,h=r*(.35+uh*.9),tpF=Math.max(.5,1-utp*.4*(P.irr+.3));
  const tl=P.irr*.35+.05,kk=u=>u[0]<.5?0:Math.floor(u[1]*4);
  const R=rotm(kk(ra[0])*Math.PI/2+gr[0]*tl,kk(ra[1])*Math.PI/2+gr[1]*tl,kk(ra[2])*Math.PI/2+gr[2]*tl);
  return build([x,y,z],R,hx,hy,h,tpF,tone,ue,rk,cs,null);
 }
 function chain(core,sp,sx,aj){
  const rn=mk(seed*65537+att*977+sp.kind*131+sp.i*7919+11),u=[],gg=[];
  for(let i=0;i<64;i++)u.push(rn());
  for(let i=0;i<16;i++)gg.push(Math.sqrt(-2*Math.log(1-rn()))*Math.cos(6.2832*rn()));
  const N=sp.n,fr=N>1?sp.i/(N-1):.5,kd=sp.kind;
  let ax,ay,az,d;
  if(kd===0){ax=-.12-u[0]*.1;ay=.2+u[1]*.15;az=(fr-.5)*.8+(u[2]-.5)*.08;d=[-(.3+u[3]*.8),(u[4]-.35)*1.2,(u[5]-.5)*.5]}
  else if(kd===1){ax=-.3-u[0]*.1;ay=-.35+u[1]*.15;az=(fr-.5)*.5+(u[2]-.5)*.08;d=[-(.4+u[3]*.6),(u[4]-.2),(u[5]-.2)*.8]}
  else{ax=-.1-u[0]*.3;ay=-.5+u[1]*.9;az=(u[2]-.5)*.6;d=[-(.2+u[3]*.8),(u[4]-.5)*2,(u[5]-.5)*1.5]}
  ax*=sx;d[0]*=sx;d=[d[0]+gg[0]*aj*.5,d[1]+gg[1]*aj*.5,d[2]+gg[2]*aj*.5];az+=gg[3]*aj*.1;
  const nz=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
  d=nz(d);
  let q=null,bd=1e9;
  for(const b of core){const dd=Math.hypot(b.c[0]-ax,b.c[1]-ay,b.c[2]-az);if(dd<bd){bd=dd;q=b}}
  let st=[ax-q.c[0],ay-q.c[1],az-q.c[2]];const sl=Math.hypot(st[0],st[1],st[2]),mx=q.rin*.7;
  if(sl>mx)st=st.map(v=>v*mx/sl);
  let S=[q.c[0]+st[0],q.c[1]+st[1],q.c[2]+st[2]];
  const ns=P.seg,total=.2+.9*P.len,segs=[];
  for(let j=0;j<ns;j++){
   if(j>0){const tgt=kd===0?[0,1,0]:kd===1?[-.2*sx,.3,.9]:[0,0,0],gr=kd===2?0:.55,sc=kd===2?.7:.3;
    d=nz([d[0]*(1-gr)+tgt[0]*gr+gg[4+j]*sc*sx,d[1]*(1-gr)+tgt[1]*gr+gg[8+j]*sc*.8,d[2]*(1-gr)+tgt[2]*gr+gg[12+j]*sc])}
   const l=total/ns*(1-.08*j);
   const rBase = P.size * (.3 + 0.5 * u[6 + j]);
   const scaleX = 0.5 + 1.5 * u[10 + j];
   const scaleY = 0.5 + 1.5 * u[18 + j];
   const hx = 0.707 * rBase * scaleX;
   const hy = 0.707 * rBase * scaleY;
   const E=[S[0]+d[0]*l,S[1]+d[1]*l,S[2]+d[2]*l],C=[(S[0]+E[0])/2,(S[1]+E[1])/2,(S[2]+E[2])/2];
   let R=frame(sx<0?[-d[0],d[1],d[2]]:d,u[14+j]*6.2832);
   if(sx<0)R=[R[0].map(x=>-x),R[1],R[2]];
   const rk=[u[20+j*4],u[21+j*4],u[22+j*4],u[23+j*4]],cs=[u[36+j*4],u[37+j*4],u[38+j*4],u[39+j*4]];
   const customTp = 0.3 + 0.9 * u[45 + j];
   const b=build(C,R,hx,hy,l/2,.7,u[56+j],u[52+j],rk,cs,customTp);
   b.limb=true;segs.push(b);
   S=[E[0]-d[0]*l*.15,E[1]-d[1]*l*.15,E[2]-d[2]*l*.15];
  }
  return segs;
 }
 const a=1-P.sym,L=Math.ceil(P.n/2),left=[];
 for(let i=0;i<L;i++)left.push(fresh());
 const big=[...left].sort((u,v)=>v.rin-u.rin)[0];
 big.c[0]=Math.max(big.c[0],-big.rin*.8);
 connect(left);
 const out=[];
 for(const s of left){
  out.push(s);
  const ur=rnd(),f2=fresh(),sc=Math.exp(g()*a*.5),Rj=rotm(g()*a*.4,g()*a*.6,g()*a*1.2),jx=g(),jy=g(),jz=g();
  let m;
  if(ur<a*.5){m=f2;m.c[0]=Math.abs(m.c[0])}
  else m={c:[-s.c[0]+jx*a*.25,s.c[1]+jy*a*.2,s.c[2]+jz*a*.1],rin:s.rin*sc,tone:s.tone,n:s.n,
   V:s.V.map(v=>mul(Rj,[-v[0]*sc,v[1]*sc,v[2]*sc]))};
  out.push(m);
 }
 connect(out);
 const core=out.slice(),kinds=[P.legs,P.arms,P.apps];
 for(let kd=0;kd<3;kd++)for(let i=0;i<kinds[kd];i++){
  const sp={kind:kd,i,n:kinds[kd]};
  out.push(...chain(core,sp,1,0),...chain(core,sp,-1,a));
 }
 const lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
 for(const s of out)for(const v of s.V)for(let i=0;i<3;i++){const q=s.c[i]+v[i];lo[i]=Math.min(lo[i],q);hi[i]=Math.max(hi[i],q)}
 const ct=lo.map((l,i)=>(l+hi[i])/2);
 for(const s of out){s.c=s.c.map((q,i)=>q-ct[i]);s.F=makeFaces(s)}
 return out;
}

const LX=-.55,LY=-.6,LZ=.58;
function project(bodies,P,lite){
 const th=P.yaw*Math.PI/180,c=Math.cos(th),sn=Math.sin(th),ph=P.pitch*Math.PI/180,cp=Math.cos(ph),sp=Math.sin(ph),k=P.persp*.7,la=P.lean*Math.PI/180,cl=Math.cos(la),sl=Math.sin(la);
 const T=(x,y0,z0)=>{const y=y0*cl+z0*sl,z=-y0*sl+z0*cl,z1=-x*sn+z*c;return[x*c+z*sn,y*cp+z1*sp,-y*sp+z1*cp]};
 const proj=q=>{const f=1/Math.max(.35,1-k*q[2]);return[q[0]*f,q[1]*f,k>0?f:q[2]]};
 const bulge=P.curve>.01,U=bulge?[.4,.75,1]:null,S=bulge?2:1;
 const tris=[],polys=[];let m=.001;
 for(const s of bodies){
  polys.push({pts:hull(s.V.map(v=>{const q=proj(T(s.c[0]+v[0],s.c[1]+v[1],s.c[2]+v[2]));return[q[0],q[1]]})),tone:s.tone});
  if(lite)continue;
  const E=(p,q,r,N)=>{
   const ax=q[0]-p[0],ay=q[1]-p[1],az=q[2]-p[2],bx=r[0]-p[0],by=r[1]-p[1],bz=r[2]-p[2];
   if((ay*bz-az*by)*N[0]+(az*bx-ax*bz)*N[1]+(ax*by-ay*bx)*N[2]<0){const t=q;q=r;r=t}
   const a=T(p[0],p[1],p[2]),b=T(q[0],q[1],q[2]),d=T(r[0],r[1],r[2]),sa=proj(a),sb=proj(b),sd=proj(d);
   if((sb[0]-sa[0])*(sd[1]-sa[1])-(sd[0]-sa[0])*(sb[1]-sa[1])<=1e-9)return;
   const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=d[0]-a[0],vy=d[1]-a[1],vz=d[2]-a[2];
   const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,l=Math.hypot(nx,ny,nz)||1;
   tris.push([sa[0],sa[1],sa[2],sb[0],sb[1],sb[2],sd[0],sd[1],sd[2],Math.max(0,(nx*LX+ny*LY+nz*LZ)/l),s.tone]);
  };
  for(const fc of s.F){
   const mm=fc.idx.length,N=fc.n,Wp=fc.idx.map(i=>[s.c[0]+s.V[i][0],s.c[1]+s.V[i][1],s.c[2]+s.V[i][2]]);
   const C=[0,0,0];for(const w of Wp){C[0]+=w[0]/mm;C[1]+=w[1]/mm;C[2]+=w[2]/mm}
   let rad=0;for(const w of Wp)rad+=Math.hypot(w[0]-C[0],w[1]-C[1],w[2]-C[2])/mm;
   const H=P.curve*.45*rad,B=[];
   for(let i=0;i<mm;i++)for(let st=0;st<S;st++){const t=st/S,a=Wp[i],b=Wp[(i+1)%mm];B.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t])}
   const M=B.length,rings=bulge?U.map(u=>B.map(b=>{const d=H*(1-u*u);return[C[0]+(b[0]-C[0])*u+N[0]*d,C[1]+(b[1]-C[1])*u+N[1]*d,C[2]+(b[2]-C[2])*u+N[2]*d]})):[B];
   const Cc=[C[0]+N[0]*H,C[1]+N[1]*H,C[2]+N[2]*H];
   for(let j=0;j<M;j++)E(Cc,rings[0][j],rings[0][(j+1)%M],N);
   for(let r=0;r<rings.length-1;r++)for(let j=0;j<M;j++){
    const j2=(j+1)%M,p0=rings[r][j],p1=rings[r][j2],q0=rings[r+1][j],q1=rings[r+1][j2];
    E(p0,p1,q1,N);E(p0,q1,q0,N)}
  }
 }
 let dmin=1e9,dmax=-1e9;
 if(lite){for(const s of polys)for(const q of s.pts)m=Math.max(m,Math.abs(q[0]),Math.abs(q[1]))}
 else for(const t of tris)for(let i=0;i<9;i+=3){m=Math.max(m,Math.abs(t[i]),Math.abs(t[i+1]));dmin=Math.min(dmin,t[i+2]);dmax=Math.max(dmax,t[i+2])}
 const k2=Math.min(1,1/m);
 for(const s of polys)s.pts=s.pts.map(q=>[q[0]*k2,q[1]*k2]);
 for(const t of tris){t[0]*=k2;t[1]*=k2;t[3]*=k2;t[4]*=k2;t[6]*=k2;t[7]*=k2}
 return{polys,tris,dmin,dmax};
}

function hsl2rgb(h,s,l){h/=360;const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t=(t%1+1)%1;return(t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p)*255};return[f(h+1/3),f(h),f(h-1/3)]}
function faceRGB(f,P){
 const s=P.light,bm=1-s+s*(.45+.75*f.I);let r,g,b;
 if(P.pal==='ink'){r=g=b=28+s*(.2+.8*f.I)*190}
 else if(P.pal==='gray'){r=g=b=(30+f.tone*150)*bm}
 else{[r,g,b]=hsl2rgb(200+f.tone*160,.35,Math.min(.95,(.3+.35*f.tone)*bm))}
 return[r,g,b];
}
function path(c,pts,H,curve){
 const V=pts.map(q=>[H+q[0]*H*.95,H+q[1]*H*.95]),m=V.length;
 if(m<3)return;
 let gx=0,gy=0;for(const v of V){gx+=v[0]/m;gy+=v[1]/m}
 c.beginPath();c.moveTo(V[0][0],V[0][1]);
 for(let i=0;i<m;i++){const a=V[i],b=V[(i+1)%m],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
  let nx=b[1]-a[1],ny=a[0]-b[0];
  if(nx*(mx-gx)+ny*(my-gy)<0){nx=-nx;ny=-ny}
  c.quadraticCurveTo(mx+nx*curve*.6,my+ny*curve*.6,b[0],b[1])}
 c.closePath();
}

const SS=2,W2=900*SS,zb=new Float32Array(W2*W2),img=new ImageData(W2,W2),D=img.data,big=document.createElement('canvas');
big.width=big.height=W2;const bctx=big.getContext('2d');
function tri(x0,y0,d0,x1,y1,d1,x2,y2,d2,r,g,b){
 const A=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);if(A<=1e-6)return;
 const gx=((d1-d0)*(y2-y0)-(d2-d0)*(y1-y0))/A,gy=((d2-d0)*(x1-x0)-(d1-d0)*(x2-x0))/A;
 const ya=Math.max(0,Math.ceil(Math.min(y0,y1,y2)-.5)),yb=Math.min(W2-1,Math.floor(Math.max(y0,y1,y2)-.5));
 const X=[x0,x1,x2],Y=[y0,y1,y2];
 for(let y=ya;y<=yb;y++){const py=y+.5;let xl=1e9,xr=-1e9;
  for(let e=0;e<3;e++){const f=(e+1)%3,ay=Y[e],by=Y[f];
   if((ay<=py&&by>py)||(by<=py&&ay>py)){const x=X[e]+(py-ay)*(X[f]-X[e])/(by-ay);if(x<xl)xl=x;if(x>xr)xr=x}}
  if(xl>xr)continue;
  const xs=Math.max(0,Math.ceil(xl-.5)),xe=Math.min(W2-1,Math.ceil(xr-.5)-1);
  let d=d0+gx*(xs+.5-x0)+gy*(py-y0),i=y*W2+xs;
  for(let x=xs;x<=xe;x++,i++,d+=gx){if(d>zb[i]){zb[i]=d;const j=i*4;D[j]=r;D[j+1]=g;D[j+2]=b}}
 }
}
function zrender(res,P){
 zb.fill(-1e9);
 const H=W2/2,K=H*.95;
 for(const t of res.tris){
  const rgb=faceRGB({I:t[9],tone:t[10]},P);
  tri(H+t[0]*K,H+t[1]*K,t[2],H+t[3]*K,H+t[4]*K,t[5],H+t[6]*K,H+t[7]*K,t[8],rgb[0],rgb[1],rgb[2]);
 }
 const dr=(res.dmax-res.dmin)||1,op=1-P.op;
 for(let i=0,j=0;i<W2*W2;i++,j+=4){
  let r=244,g=241,b=234;
  if(zb[i]>-1e8){r=D[j];g=D[j+1];b=D[j+2];
   const t=(zb[i]-res.dmin)/dr,h=Math.min(1,Math.max(0,P.air*(1-t)*.75));
   r+=(244-r)*h;g+=(241-g)*h;b+=(234-b)*h;
   r+=(244-r)*op;g+=(241-g)*op;b+=(241-b)*op}
  D[j]=r;D[j+1]=g;D[j+2]=b;D[j+3]=255}
 bctx.putImageData(img,0,0);
}
function draw(c,res,W,P,fill){
 if(fill){c.clearRect(0,0,W,W);c.fillStyle='#000';for(const s of res.polys){path(c,s.pts,W/2,0);c.fill()}return}
 zrender(res,P);
 c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 c.drawImage(big,0,0,W,W);
}

const off=document.createElement('canvas');off.width=off.height=96;
const octx=off.getContext('2d',{willReadFrequently:true});
function good(polys,P){
 octx.fillStyle='#fff';octx.fillRect(0,0,96,96);
 draw(octx,polys,96,P,true);
 const d=octx.getImageData(0,0,96,96).data,N=96,f=new Uint8Array(N*N);
 let cnt=0,x0=N,x1=0,y0=N,y1=0;
 for(let i=0;i<N*N;i++)if(d[i*4]<128){f[i]=1;cnt++;const x=i%N,y=(i/N)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(!cnt)return false;
 let best=0;const seen=new Uint8Array(N*N);
 for(let i=0;i<N*N;i++){if(!f[i]||seen[i])continue;let sz=0;const st=[i];seen[i]=1;
  while(st.length){const j=st.pop();sz++;const x=j%N,y=(j/N)|0;
   for(const k of [x>0?j-1:-1,x<N-1?j+1:-1,y>0?j-N:-1,y<N-1?j+N:-1])if(k>=0&&f[k]&&!seen[k]){seen[k]=1;st.push(k)}}
  if(sz>best)best=sz}
 const w=x1-x0+1,h=y1-y0+1,fill=cnt/(w*h),cover=cnt/(N*N);
 return best/cnt>.93&&h/w>=.45&&Math.max(w,h)>.6*N&&cover>.04&&cover<.5&&fill>.15;
}

function params(){
 const v={};ids.forEach(k=>v[k]=+$(k).value);
 return{n:v.n,size:v.size/100,spread:v.spread/100,poly:v.poly/100,irr:v.irr/100,cre:v.cre/100,sym:v.sym/100,op:v.op/100,curve:v.curve/100,yaw:v.yaw,pitch:v.pitch,lean:v.lean,persp:v.persp/100,legs:v.legs,arms:v.arms,apps:v.apps,len:v.len/100,seg:v.seg,light:v.light/100,air:v.air/100,pal:$('pal').value};
}
function render(){
 ids.forEach(k=>$('v_'+k)&&($('v_'+k).textContent=$(k).value));
 const P=params(),seed=+$('seed').value||1,ref={...P,yaw:45,pitch:29,lean:0,persp:0,curve:0,poly:0};
 let att=0,ok=true;
 if($('flt').checked){
  ok=false;
  for(att=0;att<80;att++){if(good(project(generate(ref,seed,att),ref,true),ref)){ok=true;break}}
  if(!ok)att=0;
 }
 const bodies=generate(P,seed,att);
 draw(ctx,project(bodies,P),900,P,false);
 $('info').textContent=$('flt').checked?(ok?`Matched variation #${att+1}`:'No match found, showing first variant'):'';
}
ids.forEach(k=>$(k).addEventListener('input',render));
function randLimbs(){
 const rn=mk(((+$('seed').value||1)*2654435761)>>>0),pick=a=>a[Math.floor(rn()*a.length)];
 $('legs').value=pick([1,2,2,3,3,4]);$('arms').value=pick([0,1,1,2,2,3]);$('apps').value=pick([0,0,1,1,2,3]);
 $('seg').value=pick([2,3,3,4]);$('len').value=30+Math.floor(rn()*50);
}
$('pal').onchange=$('flt').onchange=render;
$('seed').oninput=()=>{if($('rl').checked)randLimbs();render()};
$('new').onclick=()=>{$('seed').value=Math.floor(Math.random()*99999)+1;if($('rl').checked)randLimbs();render()};
$('save').onclick=()=>{const a=document.createElement('a');a.download='blob-'+$('seed').value+'.png';a.href=cv.toDataURL('image/png');a.click()};
$('seed').value=Math.floor(Math.random()*99999)+1;
randLimbs();

document.querySelectorAll('label > span > b').forEach(bEl => {
 const id = bEl.id.replace('v_', '');
 const slider = $(id);
 if (!slider) return;
 
 bEl.style.cursor = 'pointer';
 bEl.title = 'Click to type value';
 
 bEl.onclick = (e) => {
  e.stopPropagation();
  if (bEl.querySelector('input')) return;
  const curVal = slider.value;
  
  const input = document.createElement('input');
  input.type = 'number';
  input.value = curVal;
  input.min = slider.min;
  input.max = slider.max;
  input.step = slider.step || 1;
  input.style.width = '52px';
  input.style.font = 'inherit';
  input.style.fontSize = '12px';
  input.style.padding = '0 2px';
  input.style.textAlign = 'right';
  input.style.background = 'var(--bg)';
  input.style.color = 'var(--fg)';
  input.style.border = '1px solid var(--acc)';
  input.style.borderRadius = '3px';
  input.style.outline = 'none';
  
  bEl.textContent = '';
  bEl.appendChild(input);
  input.focus();
  input.select();
  
  const commit = () => {
   let val = parseFloat(input.value);
   if (!isNaN(val)) {
    val = Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), val));
    slider.value = val;
    render();
   } else {
    bEl.textContent = slider.value;
   }
  };
  
  input.onblur = commit;
  input.onkeydown = (ev) => {
   if (ev.key === 'Enter') {
    commit();
    input.blur();
   } else if (ev.key === 'Escape') {
    bEl.textContent = slider.value;
   }
  };
 };
});

render();
</script>
<script>
(() => {
 // Site Key из Cloudflare Turnstile. Пока пусто, капча отключена и лайки работают без неё.
 const TS_SITEKEY = '';

 const btn = document.getElementById('like');
 if (!btn) return;
 const cnt = document.getElementById('likeCount'), lbl = document.getElementById('likeLbl'), msg = document.getElementById('likeMsg');
 const KEY = 'blobgen_liked';
 let count = 0, shown = 0, liked = false, busy = false, tsId = null, tsDone = null, tsFail = null;

 const store = {
  get: () => { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } },
  set: () => { try { localStorage.setItem(KEY, '1'); } catch (e) {} }
 };
 function show(n) {
  const from = shown, t0 = performance.now();
  const step = t => {
   const k = Math.min(1, (t - t0) / 450);
   shown = Math.round(from + (n - from) * (1 - Math.pow(1 - k, 3)));
   cnt.textContent = shown.toLocaleString();
   if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
 }
 function setLiked(v) {
  liked = v;
  btn.classList.toggle('on', v);
  btn.setAttribute('aria-pressed', v ? 'true' : 'false');
  lbl.textContent = v ? 'Thanks!' : 'Like';
 }
 function burst() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 9; i++) {
   const p = document.createElement('span'), a = (i / 9) * 6.283 + Math.random() * .5, d = 26 + Math.random() * 18;
   p.className = 'pt';
   p.style.setProperty('--dx', Math.cos(a) * d + 'px');
   p.style.setProperty('--dy', Math.sin(a) * d + 'px');
   btn.appendChild(p);
   setTimeout(() => p.remove(), 750);
  }
 }
 function loadTurnstile() {
  if (!TS_SITEKEY) return;
  const s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  s.async = true;
  document.head.appendChild(s);
 }
 function getToken() {
  if (!TS_SITEKEY || !window.turnstile) return Promise.resolve('');
  return new Promise((resolve, reject) => {
   tsDone = resolve;
   tsFail = () => reject(new Error('captcha'));
   if (tsId === null) {
    tsId = turnstile.render('#ts', {
     sitekey: TS_SITEKEY, execution: 'execute', appearance: 'interaction-only',
     callback: t => tsDone && tsDone(t), 'error-callback': () => tsFail && tsFail(), 'timeout-callback': () => tsFail && tsFail()
    });
   } else turnstile.reset(tsId);
   turnstile.execute(tsId);
  });
 }

 async function load() {
  try {
   const r = await fetch('/api/likes', { cache: 'no-store' });
   if (!r.ok) throw new Error('no backend');
   const d = await r.json();
   count = d.count;
   setLiked(!!d.liked || store.get());
   if (d.liked) store.set();
   btn.hidden = false;
   show(count);
   loadTurnstile();
  } catch (e) { /* бэкенда нет (например, файл открыт локально): кнопка просто не показывается */ }
 }

 btn.addEventListener('click', async () => {
  if (liked || busy) return;
  busy = true; msg.textContent = '';
  burst(); setLiked(true); count++; show(count);
  try {
   const token = await getToken();
   const r = await fetch('/api/likes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
   const d = await r.json().catch(() => ({}));
   if (!r.ok) throw d;
   count = d.count; show(count); store.set();
  } catch (e) {
   count = Math.max(0, count - 1); show(count); setLiked(false);
   msg.textContent = e && e.error === 'rate' ? 'Too many likes from your network today.' : e && e.error === 'captcha' ? 'Captcha check failed, please try again.' : 'Something went wrong, please try again.';
  }
  busy = false;
 });

 load();
})();
</script>
